<!doctype html><meta charset=utf-8><title>Admin</title><body style="background:#0a0a0b;color:#e8e4d8;font:14px monospace;padding:24px"><input id=t type=password placeholder=token> <button onclick=go()>Gör</button><table id=o style="margin-top:16px;border-collapse:collapse"></table><script>
async function go(){const r=await fetch('/api/admin',{headers:{'x-admin-token':t.value}});if(!r.ok)return o.innerHTML='<tr><td>Yetkisiz';const d=await r.json();o.innerHTML='<tr><th>Katman<th>Takma ad<th>Ülke<th>İlk giriş<th>Son giriş'+d.map(p=>`<tr><td>${p.layer}<td>${p.nick||'-'}<td>${p.country}<td>${p.first_seen.slice(0,16)}<td>${p.last_seen.slice(0,16)}`).join('')}</script><style>td,th{padding:4px 14px;border-bottom:1px solid #333;text-align:left}</style>
