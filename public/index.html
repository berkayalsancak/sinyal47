<!doctype html><html lang=tr><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Vesper 1013</title><style>

<h1>SİNYAL<b>-47</b></h1><div class=t>&gt; seek &gt; think &gt; question</div>

<div id=c><span id=ct></span><button id=ok></button></div></main><script>
const D={tr:['Bu site ilerlemeni hatırlamak için rastgele bir cihaz kimliği ve IP adresinin geri döndürülemez bir özetini saklar.','Kabul et','Gönder','Yanlış. Sinyal aynı kaldı.','Çok hızlısın. Bir dakika bekle.','Sinyal burada kesiliyor. Yeni katmanlar eklenecek. Buraya ulaştın.'],
en:['This site stores a random device ID and an irreversible hash of your IP address to remember your progress.','Accept','Submit','Wrong. The signal is unchanged.','Too fast. Wait a minute.','The signal ends here for now. New layers are coming. You made it this far.'],
de:['Diese Seite speichert eine zufällige Geräte-ID und einen nicht umkehrbaren Hash Ihrer IP, um Ihren Fortschritt zu merken.','Akzeptieren','Senden','Falsch.','Zu schnell. Warte eine Minute.','Das Signal endet hier. Neue Ebenen folgen.'],
fr:['Ce site stocke un identifiant d’appareil aléatoire et un hachage irréversible de votre IP pour mémoriser votre progression.','Accepter','Envoyer','Faux.','Trop vite. Attendez une minute.','Le signal s’arrête ici. De nouveaux niveaux arrivent.'],
es:['Este sitio guarda un ID de dispositivo aleatorio y un hash irreversible de tu IP para recordar tu progreso.','Aceptar','Enviar','Incorrecto.','Demasiado rápido. Espera un minuto.','La señal termina aquí. Llegarán nuevas capas.'],

pt:['Este site guarda um ID de dispositivo aleatório e um hash irreversível do seu IP para lembrar seu progresso.','Aceitar','Enviar','Errado.','Rápido demais. Espere um minuto.','O sinal termina aqui. Novas camadas virão.'],
it:['Questo sito salva un ID dispositivo casuale e un hash irreversibile del tuo IP per ricordare i progressi.','Accetta','Invia','Sbagliato.','Troppo veloce. Aspetta un minuto.','Il segnale finisce qui. Arriveranno nuovi livelli.']};
let T=D.en,dev=localStorage.d||(localStorage.d=crypto.randomUUID());

if(v.end){$('v').textContent=T[5];$('f').hidden=true}else{$('v').innerHTML='<h2></h2><div></div>';$('v').firstChild.textContent=v.n+' / '+r.total+' · '+v.t;$('v').lastChild.textContent=v.b;$('f').hidden=false;$('a').value=''}}
